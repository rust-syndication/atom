name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on:  ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        rust:
          - nightly
          - beta
          - stable
          - 1.83.0

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      if: matrix.rust == '1.83.0'
    - name: Resolve MSRV-compatible dependencies
      if: matrix.rust == '1.83.0'
      run: cargo +stable generate-lockfile
      env:
        CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    - uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ matrix.rust }}
    - name: Resolve dependencies
      if: matrix.rust != '1.83.0'
      run: cargo generate-lockfile
    - name: Build
      run: |
        cargo build --locked --all-targets --no-default-features --verbose
        cargo build --locked --all-targets --verbose
    - name: Run tests
      run: |
        cargo test --locked --all-targets --no-default-features --verbose
        cargo test --locked --all-targets --verbose
      env:
        RUST_BACKTRACE: 1
